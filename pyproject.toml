[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carc"
version = "0.1.0"
description = "Chronology-Aware Robustness Causality for paleoclimate proxy records"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "CARC authors"},
]
keywords = [
    "paleoclimate",
    "causal-inference",
    "granger-causality",
    "age-uncertainty",
    "proxy-records",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "cartopy>=0.22.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
ccm = ["skccm"]
pcmci = ["tigramite"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["src*"]
